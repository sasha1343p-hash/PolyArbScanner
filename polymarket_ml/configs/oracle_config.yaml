# ML Oracle для Polymarket
# Конфигурация модели и обучения

# Пути к данным и артефактам
paths:
  database: "polymarket_history.db"
  artifacts_dir: "artifacts"
  logs_dir: "logs"
  model_bundle: "artifacts/ml_oracle_bundle.pkl"
  train_stats: "artifacts/train_stats.json"

# Параметры извлечения признаков
features:
  # Временные окна для статистик (в часах)
  windows: [1, 6, 24, 168, 720]  # 1h, 6h, 24h, 7d, 30d
  
  # Волатильность
  volatility_windows: [24, 168, 720]
  
  # RSI период
  rsi_period: 14
  
  # Нормализация
  normalize: true
  scaler_type: "standard"  # standard, minmax, robust

# Параметры обучения модели
training:
  # Разделение данных
  test_size: 0.2
  n_splits: 5  # для TimeSeriesSplit
  
  # Модели
  models:
    xgboost:
      enabled: true
      params:
        n_estimators: 500
        max_depth: 6
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
        min_child_weight: 3
        random_state: 42
        early_stopping_rounds: 50
        eval_metric: "auc"
    
    lightgbm:
      enabled: true
      params:
        n_estimators: 500
        max_depth: 6
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
        min_child_weight: 3
        random_state: 42
        early_stopping_rounds: 50
        eval_metric: "auc"
  
  # Калибровка
  calibration:
    enabled: true
    method: "isotonic"  # isotonic, sigmoid
    cv: 5
  
  # Дисбаланс классов
  handle_imbalance:
    enabled: true
    method: "scale_pos_weight"  # scale_pos_weight, smote, class_weight

# Мониторинг дрейфа
monitoring:
  # Пороги для drift detection
  psi_threshold: 0.2
  ks_threshold: 0.1
  
  # Ключевые фичи для мониторинга
  key_features:
    - "price_mean_24h"
    - "price_std_24h"
    - "volume_mean_24h"
    - "momentum_24h"
    - "days_to_expiry"
  
  # Частота проверки (в часах)
  check_interval_hours: 24

# Ансамбль
ensemble:
  use_ml: true
  use_heuristic: true
  ml_weight: 0.7
  heuristic_weight: 0.3
  
  # Минимальная уверенность для использования ML
  min_confidence: 0.6

# Логирование
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "logs/ml_oracle.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Воспроизводимость
reproducibility:
  random_state: 42
  numpy_seed: 42
  python_hash_seed: 42
